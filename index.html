/* Anti pull-to-refresh aggressivo: nessuna zona della pagina puo' essere
   tirata verso il basso per far comparire il cerchio bianco di ricarica
   di Chrome / WebView. Solo i contenitori .scroll-area scorrono. */

html, body {
  overscroll-behavior: none !important;
  position: fixed !important;
  overflow: hidden !important;
  height: 100dvh !important;
  height: 100% !important;
  touch-action: none !important;
  overscroll-behavior-y: none !important;
  -webkit-overflow-scrolling: auto !important;
}

body {
  /* La WebView non deve mai mostrare il suo indicatore di refresh. */
  overscroll-behavior: none;
}

/* Niente cerchio / spinner di refresh: nessun elemento decorativo
   assoluto puo' sovrapporsi all'header. */

.no-pull-refresh {
  overscroll-behavior: none !important;
  touch-action: none !important;
}

/* Titolo BENVENUTO: solo testo in flusso. Nessun elemento sovrapposto,
   nessun cerchio bianco, nessuna freccia di refresh sopra METALAYNS. */

.title-clean{
  position:relative;
  isolation:isolate;
  overflow:visible
}

.title-clean::before,.title-clean::after{
  display:none !important;
  content:none !important
}
